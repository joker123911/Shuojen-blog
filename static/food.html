        let restaurants = [];
        let excludedTags = [];
        let currentPool = [];
        let lastPickedId = null;

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        window.onload = () => {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('food_decider_v2')); } catch (e) {}
            // 有存過（包含清空後的空名單）就用存的；從沒存過才載入預設名單
            if (Array.isArray(saved)) {
                restaurants = saved;
            } else {
                parseAndSetData(DEFAULT_RAW);
            }
            renderList();
        };

        function renderList() {
            const listDiv = document.getElementById('restaurantList');
            const startBtn = document.getElementById('startBtn');
            const stats = document.getElementById('statsCount');
            listDiv.innerHTML = '';
            stats.innerText = `目前名單共有 ${restaurants.length} 家店家`;

            if (restaurants.length === 0) {
                listDiv.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">目前沒有名單</div>';
                startBtn.style.display = 'none';
                return;
            }
            startBtn.style.display = '';

            restaurants.forEach(r => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 p-4 rounded-xl flex justify-between items-center group transition-all";
                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-bold text-slate-800 text-sm truncate">${escapeHtml(r.name)}</h3>
                            <span class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded uppercase">${escapeHtml(r.foodType || '一般')}</span>
                        </div>
                        <div class="flex flex-wrap gap-1 mt-1">
                            ${r.distance ? `<span class="text-[11px] text-slate-500 border border-slate-100 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fa-solid fa-location-dot text-[9px]"></i>${escapeHtml(r.distance)}</span>` : ''}
                            ${r.tags ? r.tags.split(',').map(t => t.trim()).filter(Boolean).slice(0, 3).map(t => `<span class="text-[11px] text-slate-400 border border-slate-100 px-1.5 py-0.5 rounded">#${escapeHtml(t)}</span>`).join('') : ''}
                        </div>
                    </div>
                    <button onclick="deleteRest(${r.id})" class="text-slate-300 hover:text-red-500 p-2 transition-colors" title="刪除"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                listDiv.appendChild(card);
            });
        }

        function toggleBatchArea() { document.getElementById('batchArea').classList.toggle('hidden'); }
        function toggleAddForm() { document.getElementById('addForm').classList.toggle('hidden'); }

        function parseAndSetData(text) {
            const lines = text.trim().split('\n');
            restaurants = lines.map((line, index) => {
                const parts = line.split('|').map(p => p.trim());
                return parts[0] ? { id: Date.now() + index, name: parts[0], distance: parts[1]||'', foodType: parts[2]||'', tags: parts[3]||'' } : null;
            }).filter(r => r);
            updateStorage();
        }

        function importBatch() {
            const text = document.getElementById('batchInput').value;
            if (confirm('確定取代名單？')) { parseAndSetData(text); renderList(); toggleBatchArea(); }
        }

        function exportBatch() {
            const str = restaurants.map(r => `${r.name} | ${r.distance} | ${r.foodType} | ${r.tags}`).join('\n');
            document.getElementById('batchInput').value = str;
        }

        function saveRestaurant() {
            const name = document.getElementById('newName').value;
            if (!name) return;
            restaurants.push({ id: Date.now(), name, distance: document.getElementById('newDist').value, foodType: document.getElementById('newType').value, tags: document.getElementById('newTags').value });
            updateStorage(); renderList(); toggleAddForm();
            ['newName', 'newDist', 'newType', 'newTags'].forEach(id => document.getElementById(id).value = '');
        }

        function deleteRest(id) { restaurants = restaurants.filter(r => r.id !== id); updateStorage(); renderList(); }
        function clearAll() { if(confirm('確定要清空所有店家嗎？')) { restaurants = []; updateStorage(); renderList(); } }
        function updateStorage() {
            try { localStorage.setItem('food_decider_v2', JSON.stringify(restaurants)); } catch (e) {}
        }

        // 程式裡的預設名單更新後，已經存過名單的瀏覽器不會自動換新，用這個按鈕重新載入
        function resetToDefault() {
            if (confirm('要換回預設名單嗎？你自己新增或修改的店家會被取代。')) {
                parseAndSetData(DEFAULT_RAW);
                renderList();
            }
        }

        function startGame() {
            document.getElementById('listMode').classList.add('hidden');
            document.getElementById('gameMode').classList.remove('hidden');
            excludedTags = []; currentPool = [...restaurants]; lastPickedId = null;
            pickOne();
        }

        function stopGame() {
            document.getElementById('gameMode').classList.add('hidden');
            document.getElementById('listMode').classList.remove('hidden');
        }

        function pickOne() {
            const validPool = currentPool.filter(r => {
                const allTags = `${r.distance},${r.foodType},${r.tags}`.split(',').map(t => t.trim()).filter(t => t);
                return !allTags.some(t => excludedTags.includes(t));
            });
            const nameEl = document.getElementById('targetName');
            const tagsEl = document.getElementById('targetTags');
            const rejectEl = document.getElementById('rejectTags');
            const mapLink = document.getElementById('mapLink');

            if (validPool.length === 0) {
                nameEl.innerHTML = '<span class="text-lg">沒選項了 😭</span>';
                tagsEl.innerHTML = ""; rejectEl.innerHTML = '<p class="text-xs text-slate-400">排除太多囉</p>';
                mapLink.classList.add('hidden');
                return;
            }

            // 「換一個」時避開剛剛抽到的那家（只剩一家時例外）
            const pickPool = validPool.length > 1 ? validPool.filter(r => r.id !== lastPickedId) : validPool;
            const picked = pickPool[Math.floor(Math.random() * pickPool.length)];
            lastPickedId = picked.id;
            nameEl.innerText = picked.name;

            // 更新 Google Maps 搜尋連結
            mapLink.classList.remove('hidden');
            mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(picked.name)}`;

            tagsEl.innerHTML = ''; rejectEl.innerHTML = '';
            const tags = [...new Set(`${picked.distance},${picked.foodType},${picked.tags}`.split(',').map(t => t.trim()).filter(t => t))];
            tags.forEach(t => {
                const tagEl = document.createElement('span');
                tagEl.className = 'bg-indigo-50 text-indigo-500 font-bold px-2 py-1 rounded-full text-xs';
                tagEl.textContent = `#${t}`;
                tagsEl.appendChild(tagEl);

                // 用事件綁定而不是 onclick 字串，標籤含引號時按鈕才不會壞掉
                const btn = document.createElement('button');
                btn.className = 'bg-white text-slate-400 border border-slate-100 px-3 py-1.5 rounded-xl text-xs hover:text-red-400 transition shadow-sm';
                btn.textContent = `不吃 ${t}`;
                btn.addEventListener('click', () => excludeTag(t));
                rejectEl.appendChild(btn);
            });
        }

        function reroll() {
            const card = document.getElementById('suggestionCard');
            card.style.opacity = '0.5';
            setTimeout(() => { pickOne(); card.style.opacity = '1'; }, 200);
        }

        function excludeTag(tag) { excludedTags.push(tag); pickOne(); }

        function acceptChoice() {
            const name = document.getElementById('targetName').innerText;
            if (!name.includes('沒選項')) alert(`🎉 決定去吃：${name}`);
            stopGame();
        }
    </script>
