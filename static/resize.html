<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片批次處理工具 - Shuojen.com</title>
    <meta name="description" content="在瀏覽器內快速完成圖片的壓縮與格式轉換">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/tools/tool.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/tools/tool-theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* 拖曳到上傳區時的狀態 */
        #drop-zone.dragover {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
    </style>
</head>
<body class="tool-page">

    <main class="tool-card max-w-5xl fade-in">
        <header class="tool-header">
            <div class="tool-header-main">
                <div class="tool-icon"><i class="fa-solid fa-images"></i></div>
                <div>
                    <h1 class="tool-title">圖片批次處理工具</h1>
                    <p class="tool-subtitle">快速壓縮、調整尺寸並批次重新命名圖片，全部在瀏覽器內完成</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

            <section class="flex flex-col gap-6">
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer transition-all hover:border-indigo-400 hover:bg-slate-50 flex flex-col items-center justify-center gap-3">
                    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-2xl mb-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <h3 class="font-bold text-slate-700 text-lg" id="drop-text">拖曳圖片到這裡</h3>
                    <p class="text-sm text-slate-400">或點擊選擇檔案（支援 JPG、PNG、WebP）</p>
                    <input type="file" id="upload" accept="image/*" multiple class="hidden">
                </div>

                <div class="tool-panel flex flex-col gap-4">
                    <h3 class="tool-section-title"><i class="fa-solid fa-sliders text-indigo-500"></i> 處理設定</h3>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="prefix" class="tool-label">命名前綴</label>
                            <input type="text" id="prefix" value="photo_" class="tool-input">
                        </div>
                        <div>
                            <label for="startNum" class="tool-label">起始編號（決定位數）</label>
                            <input type="text" id="startNum" value="001" inputmode="numeric" class="tool-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="maxWidth" class="tool-label">最大寬度 (px)</label>
                            <input type="number" id="maxWidth" value="1200" min="1" class="tool-input">
                        </div>
                        <div>
                            <label for="maxSize" class="tool-label">大小限制 (KB)</label>
                            <input type="number" id="maxSize" value="1000" min="1" class="tool-input text-orange-500 font-bold">
                        </div>
                    </div>

                    <div>
                        <label for="format" class="tool-label">輸出格式</label>
                        <select id="format" class="tool-input">
                            <option value="image/jpeg">JPG（預設壓縮）</option>
                            <option value="image/webp">WebP（更佳壓縮率）</option>
                            <option value="image/png">PNG（保留畫質，無檔案大小限制）</option>
                        </select>
                    </div>
                </div>

                <button id="processBtn" type="button" class="btn btn-primary btn-lg w-full py-4">
                    <i class="fa-solid fa-play"></i> 開始批次處理
                </button>
            </section>

            <section class="tool-panel flex flex-col h-[420px] md:h-[600px]">

                <div class="flex justify-between items-end mb-4 border-b border-slate-200 pb-3">
                    <h3 class="tool-section-title mb-0"><i class="fa-solid fa-list-check text-emerald-500"></i> 處理結果</h3>
                    <div id="status-text" class="text-xs font-bold text-slate-400">尚未開始</div>
                </div>

                <div id="progress-container" class="hidden mb-4">
                    <div class="w-full bg-slate-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <div id="result-list" class="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-3">
                    <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400 opacity-60">
                        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                        <p class="text-sm">處理後的檔案會顯示在這裡</p>
                    </div>
                </div>

                <button id="downloadAllBtn" type="button" class="hidden btn w-full mt-4 py-3 bg-slate-800 hover:bg-slate-900 text-white shadow-md">
                    <i class="fa-solid fa-file-zipper"></i> 打包下載所有圖片 (.zip)
                </button>

            </section>
        </div>
    </main>

    <footer class="tool-footer">
        <span>© Shuojen.com</span>
        <span class="tool-footer-sep">·</span>
        <a href="/tool"><i class="fa-solid fa-arrow-left text-[10px]"></i> 回小工具</a>
        <span class="tool-footer-sep">·</span>
        <button type="button" onclick="location.reload()"><i class="fa-solid fa-rotate-left text-[10px]"></i> 恢復預設值</button>
    </footer>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('upload');
        const resultList = document.getElementById('result-list');
        const emptyState = document.getElementById('empty-state');
        const processBtn = document.getElementById('processBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        let selectedFiles = [];
        let processedItems = [];
        let objectUrls = []; // 預覽與下載用的暫存網址，重新處理時釋放
        let isProcessing = false;

        // --- 拖曳與選擇檔案邏輯 ---
        dropZone.addEventListener('click', () => { if (!isProcessing) fileInput.click(); });
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            e.target.value = ''; // 讓同一批檔案可以再選一次
        });

        function revokeObjectUrls() {
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls = [];
        }

        function handleFiles(files) {
            if (isProcessing) return alert('處理中，請等目前這批完成後再選擇新圖片。');
            const validFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (validFiles.length === 0) return alert('請選擇有效的圖片檔案！');

            selectedFiles = validFiles;
            document.getElementById('drop-text').innerHTML = `<span class="text-indigo-600">已載入 ${selectedFiles.length} 張圖片</span>`;

            // 重置狀態
            revokeObjectUrls();
            processedItems = [];
            downloadAllBtn.classList.add('hidden');
            resultList.innerHTML = '';
            resultList.appendChild(emptyState);
            emptyState.style.display = 'flex';
            progressContainer.classList.add('hidden');
            statusText.innerText = '等待處理...';
            progressBar.style.width = '0%';
        }

        // --- 核心處理邏輯 ---
        processBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return alert('請先拖曳或選擇圖片！');

            const prefix = document.getElementById('prefix').value;
            const startNumStr = document.getElementById('startNum').value.trim();
            const format = document.getElementById('format').value;
            const maxWidth = parseInt(document.getElementById('maxWidth').value, 10);
            const maxSizeKB = parseInt(document.getElementById('maxSize').value, 10);

            if (!/^\d+$/.test(startNumStr)) return alert('起始編號請輸入數字（例如 001）。');
            if (!(maxWidth > 0)) return alert('最大寬度請輸入大於 0 的數字。');
            if (format !== 'image/png' && !(maxSizeKB > 0)) return alert('大小限制請輸入大於 0 的數字。');

            const files = selectedFiles.slice(); // 處理期間固定這批檔案
            const maxSize = maxSizeKB * 1024;
            const numLength = startNumStr.length; // 動態抓取使用者輸入的位數

            let ext = 'jpg';
            if (format === 'image/webp') ext = 'webp';
            if (format === 'image/png') ext = 'png';

            // UI 狀態切換
            isProcessing = true;
            processBtn.disabled = true;
            processBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
            progressContainer.classList.remove('hidden');
            emptyState.style.display = 'none';
            resultList.innerHTML = '';
            revokeObjectUrls();
            processedItems = [];
            downloadAllBtn.classList.add('hidden');

            let failedCount = 0;
            try {
                for (let i = 0; i < files.length; i++) {
                    // 修正補零邏輯
                    const num = (parseInt(startNumStr, 10) + i).toString().padStart(numLength, '0');
                    const fileName = `${prefix}${num}.${ext}`;

                    statusText.innerText = `處理中: ${i + 1} / ${files.length}`;

                    try {
                        // 執行壓縮與尺寸調整
                        const blob = await processImage(files[i], format, maxSize, maxWidth);
                        processedItems.push({ blob, fileName });
                        addResultItem(blob, fileName);
                    } catch (err) {
                        failedCount++;
                        addFailedItem(files[i].name, err.message);
                    }

                    // 更新進度條
                    const percent = Math.round(((i + 1) / files.length) * 100);
                    progressBar.style.width = percent + '%';
                }
            } finally {
                // 處理完成狀態（即使中途出錯也要解鎖按鈕）
                isProcessing = false;
                processBtn.disabled = false;
                processBtn.innerHTML = '<i class="fa-solid fa-play"></i> 重新處理';
            }

            statusText.innerText = failedCount > 0 ? `處理完成（${failedCount} 張失敗）` : '處理完成！';
            if (processedItems.length > 0) {
                downloadAllBtn.classList.remove('hidden');
                downloadAllBtn.classList.add('flex'); // 確保 flex 置中生效
            }
        });

        // --- 圖片壓縮修正邏輯 (避免卡死) ---
        async function processImage(file, format, maxSize, maxWidth) {
            const originalImg = await loadImage(file);
            let currentWidth = Math.min(maxWidth, originalImg.width); // 避免放大圖片
            let quality = 0.9;
            let blob;

            let attempts = 0;
            const maxAttempts = 6; // 最大重試次數，防止無限迴圈卡死

            while (attempts < maxAttempts) {
                attempts++;
                const canvas = document.createElement('canvas');
                const scale = currentWidth / originalImg.width;
                canvas.width = Math.max(1, Math.round(currentWidth));
                canvas.height = Math.max(1, Math.round(originalImg.height * scale));

                const ctx = canvas.getContext('2d');
                // 填充白色背景（防止 PNG 轉 JPG 時透明背景變黑）
                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

                blob = await new Promise(r => canvas.toBlob(r, format, quality));
                if (!blob) throw new Error('瀏覽器無法輸出這個格式');

                // 跳出條件：PNG(不壓縮)、達標、或已經重試達上限
                if (format === 'image/png' || blob.size <= maxSize || attempts >= maxAttempts) {
                    break;
                }

                // 遞減邏輯：先降畫質，再縮尺寸
                if (quality > 0.4) {
                    quality -= 0.15;
                } else {
                    currentWidth = Math.floor(currentWidth * 0.8); // 直接縮小 20% 寬度
                }
            }
            return blob;
        }

        // 讀不出來的圖片（例如部分瀏覽器不支援的 HEIC）要回報錯誤，否則會永遠卡在「處理中」
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張圖片')); };
                img.src = url;
            });
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        // --- UI 生成邏輯 ---
        function addFailedItem(originalName, reason) {
            const item = document.createElement('div');
            item.className = 'bg-white border border-orange-200 rounded-xl p-3 flex items-center gap-3 shadow-sm fade-in';
            item.innerHTML = `
                <div class="w-10 h-10 rounded-lg bg-orange-50 text-orange-500 flex-shrink-0 flex items-center justify-center">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="truncate">
                    <div class="font-bold text-slate-700 text-sm truncate">${escapeHtml(originalName)}</div>
                    <div class="text-xs text-orange-500 font-medium">${escapeHtml(reason)}</div>
                </div>
            `;
            resultList.appendChild(item);
        }

        function addResultItem(blob, fileName) {
            const url = URL.createObjectURL(blob);
            objectUrls.push(url);
            const sizeKB = (blob.size / 1024).toFixed(1);
            
            const item = document.createElement('div');
            item.className = 'bg-white border border-slate-100 rounded-xl p-3 flex justify-between items-center hover:border-indigo-300 transition-all shadow-sm fade-in';
            item.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-lg bg-slate-100 flex-shrink-0 flex items-center justify-center overflow-hidden">
                        <img src="${url}" class="w-full h-full object-cover opacity-80" alt="preview">
                    </div>
                    <div class="truncate">
                        <div class="font-bold text-slate-700 text-sm truncate">${escapeHtml(fileName)}</div>
                        <div class="text-xs text-orange-500 font-medium">${sizeKB} KB</div>
                    </div>
                </div>
                <a href="${url}" download="${escapeHtml(fileName)}" class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-colors flex items-center justify-center" title="單獨下載">
                    <i class="fa-solid fa-download text-xs"></i>
                </a>
            `;
            resultList.appendChild(item);
        }

        // --- 打包下載邏輯 ---
        downloadAllBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            downloadAllBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 打包中...';
            
            processedItems.forEach(item => zip.file(item.fileName, item.blob));
            const content = await zip.generateAsync({ type: "blob" });
            
            const a = document.createElement('a');
            const zipUrl = URL.createObjectURL(content);
            a.href = zipUrl;
            a.download = "processed_images.zip";
            a.click();
            setTimeout(() => URL.revokeObjectURL(zipUrl), 10000);

            downloadAllBtn.innerHTML = '<i class="fa-solid fa-file-zipper"></i> 打包下載所有圖片 (.zip)';
        });
    </script>
</body>
</html>
