<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資報酬試算表 - Shuojen.com</title>
    <meta name="description" content="快速計算投資報酬率與複利成長，理財規劃的好幫手">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/tools/tool.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/tools/tool-theme.js"></script>
</head>
<body class="tool-page">

    <main class="tool-card max-w-2xl fade-in">
        <header class="tool-header">
            <div class="tool-header-main">
                <div class="tool-icon"><i class="fa-solid fa-chart-line"></i></div>
                <div>
                    <h1 class="tool-title">投資報酬試算表</h1>
                    <p class="tool-subtitle">試算每年定額投入的複利成長，表格中的數字都可以直接修改</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="startAge" class="tool-label">起始年齡</label>
                <input type="number" id="startAge" value="27" class="tool-input">
            </div>
            <div>
                <label for="endAge" class="tool-label">結束年齡</label>
                <input type="number" id="endAge" value="67" class="tool-input">
            </div>
            <div>
                <label for="annualSavings" class="tool-label">每年存入金額</label>
                <input type="number" id="annualSavings" value="12" class="tool-input">
            </div>
            <div>
                <label for="rateOfReturn" class="tool-label">年報酬率 (%)</label>
                <input type="number" id="rateOfReturn" value="5" class="tool-input">
            </div>
        </div>
        <p class="text-xs text-slate-400 text-right mt-2 mb-4">金額單位：萬元</p>

        <button type="button" class="btn btn-primary btn-lg w-full calculate-btn" onclick="generateInitialTable()">
            <i class="fa-solid fa-table"></i> 產生 / 重設表格
        </button>
        <p id="error-message" class="text-sm font-medium text-red-500 text-center mt-3" style="display: none;"></p>

        <div class="mt-6 border border-slate-100 rounded-2xl overflow-x-auto custom-scrollbar">
            <table class="w-full text-sm text-center border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs font-bold">
                    <tr>
                        <th class="py-3 px-2">年齡</th>
                        <th class="py-3 px-2">年存</th>
                        <th class="py-3 px-2">報酬</th>
                        <th class="py-3 px-2">總金額</th>
                        <th class="py-3 px-2">總損益</th>
                    </tr>
                </thead>
                <tbody id="results-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <footer class="tool-footer">
        <span>© Shuojen.com</span>
        <span class="tool-footer-sep">·</span>
        <a href="/tool"><i class="fa-solid fa-arrow-left text-[10px]"></i> 回小工具</a>
    </footer>

<script>
    // 表格實際涵蓋的年齡範圍：以「產生表格」當下為準。
    // 之後只改了上方的年齡欄位但還沒重新產生時，編輯表格仍以這個範圍計算，避免找不到對應列而出錯。
    let tableStartAge = null;
    let tableEndAge = null;

    // 表格內可編輯數字的樣式
    const CELL_INPUT_CLASS = 'w-full max-w-[6.5rem] text-center bg-transparent border border-transparent rounded-lg px-1 py-1.5 hover:bg-slate-100 focus:bg-white focus:border-indigo-400 focus:outline-none transition-colors';

    document.addEventListener('DOMContentLoaded', () => {
        generateInitialTable();
        // 年報酬率改了就直接重算（保留表格中手動修改過的年存金額）
        document.getElementById('rateOfReturn').addEventListener('input', () => {
            if (tableStartAge !== null && !isNaN(getRate())) updateFromRow(tableStartAge);
        });
    });

    function getRate() {
        return parseFloat(document.getElementById('rateOfReturn').value) / 100;
    }

    function generateInitialTable() {
        const startAge = parseInt(document.getElementById('startAge').value);
        const endAge = parseInt(document.getElementById('endAge').value);
        const annualSavings = parseFloat(document.getElementById('annualSavings').value);
        const resultsBody = document.getElementById('results-body');
        const errorMessage = document.getElementById('error-message');
        resultsBody.innerHTML = '';
        errorMessage.style.display = 'none';
        tableStartAge = null;
        tableEndAge = null;

        if (isNaN(startAge) || isNaN(endAge) || isNaN(annualSavings) || isNaN(getRate()) || startAge >= endAge) {
            errorMessage.textContent = '請輸入有效數字，起始年齡須小於結束年齡。';
            errorMessage.style.display = 'block';
            return;
        }
        if (endAge - startAge > 150) {
            errorMessage.textContent = '年齡區間太大，請在 150 年以內。';
            errorMessage.style.display = 'block';
            return;
        }

        tableStartAge = startAge;
        tableEndAge = endAge;

        for (let age = startAge; age <= endAge; age++) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="py-1.5 px-2 text-slate-500 font-medium">${age}</td>
                <td class="py-1.5 px-1"><input type="number" id="savings-${age}" value="${annualSavings.toFixed(1)}" step="0.1" onchange="handleSavingsChange(${age})" class="${CELL_INPUT_CLASS}"></td>
                <td id="return-${age}" class="py-1.5 px-2 font-bold text-emerald-500">0.0</td>
                <td class="py-1.5 px-1"><input type="number" id="total-${age}" value="0.0" data-full-value="0.0" step="0.1" onchange="handleTotalChange(${age})" class="${CELL_INPUT_CLASS} font-bold text-slate-800"></td>
                <td id="profit-percent-${age}" class="py-1.5 px-2 font-bold">0.0%</td>
            `;
            resultsBody.appendChild(row);
        }
        updateFromRow(startAge);
    }

    function handleSavingsChange(age) {
        updateFromRow(age);
    }

    function handleTotalChange(age) {
        if (tableEndAge === null) return;
        const changedTotalInput = document.getElementById(`total-${age}`);
        const manualTotal = parseFloat(changedTotalInput.value);

        // 清空或輸入非數字時，改回依公式計算的值
        if (isNaN(manualTotal)) {
            updateFromRow(age);
            return;
        }
        changedTotalInput.dataset.fullValue = manualTotal;

        if (age < tableEndAge) {
            updateFromRow(age + 1);
        } else {
            // 如果是最後一年被手動修改，也重新計算當年度的損益%
            updateProfitPercentRow(age);
        }
    }

    function updateFromRow(startUpdateAge) {
        if (tableStartAge === null) return;
        const rate = getRate();
        const rateOfReturn = isNaN(rate) ? 0 : rate;

        for (let age = startUpdateAge; age <= tableEndAge; age++) {
            const prevTotalElement = document.getElementById(`total-${age - 1}`);
            const previousTotal = (age === tableStartAge) ? 0 : parseFloat(prevTotalElement.dataset.fullValue || prevTotalElement.value);

            const currentSavings = parseFloat(document.getElementById(`savings-${age}`).value) || 0;
            const currentReturn = previousTotal * rateOfReturn;
            const newTotal = previousTotal + currentReturn + currentSavings;

            const totalInput = document.getElementById(`total-${age}`);
            document.getElementById(`return-${age}`).textContent = currentReturn.toFixed(1);

            totalInput.value = newTotal.toFixed(1);
            totalInput.dataset.fullValue = newTotal.toFixed(5);

            // 計算並更新該年齡的總損益%
            updateProfitPercentRow(age);
        }
    }

    function updateProfitPercentRow(age) {
        let totalPrincipal = 0;

        // 累計從起始年齡到當前年齡的總投入本金
        for (let i = tableStartAge; i <= age; i++) {
            const savingsInput = document.getElementById(`savings-${i}`);
            if (savingsInput) {
                totalPrincipal += parseFloat(savingsInput.value || 0);
            }
        }

        const totalInput = document.getElementById(`total-${age}`);
        const currentTotal = parseFloat(totalInput.dataset.fullValue || totalInput.value || 0);

        let profitPercent = 0;
        if (totalPrincipal > 0) {
            profitPercent = ((currentTotal - totalPrincipal) / totalPrincipal) * 100;
        }

        const profitPercentElement = document.getElementById(`profit-percent-${age}`);
        if (profitPercentElement) {
            profitPercentElement.textContent = profitPercent.toFixed(1) + '%';
            // 依據正負值調整顏色：正數紫色、負數紅色、零為灰色
            if (profitPercent > 0) {
                profitPercentElement.style.color = '#4f46e5';
            } else if (profitPercent < 0) {
                profitPercentElement.style.color = '#ef4444';
            } else {
                profitPercentElement.style.color = '#64748b';
            }
        }
    }
</script>

</body>
</html>
