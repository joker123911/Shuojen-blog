<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜人名遊戲 - Shuojen.com</title>
    <meta name="description" content="看完《惡棍特工》就會想玩的派對小遊戲，兩人以上進行">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/tools/tool.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/tools/tool-theme.js"></script>
</head>
<body class="tool-page justify-center">

    <main class="tool-card max-w-md fade-in">
        <header class="tool-header">
            <div class="tool-header-main">
                <div class="tool-icon"><i class="fa-solid fa-user-secret"></i></div>
                <div>
                    <h1 class="tool-title" id="title-text">猜人名遊戲</h1>
                    <p class="tool-subtitle">兩人以上的派對遊戲，一支手機輪流傳</p>
                </div>
            </div>
            <div class="tool-header-actions">
                <button type="button" class="btn btn-secondary py-1.5 px-3 text-xs" onclick="toggleRules()" id="rules-btn">遊戲規則</button>
                <button type="button" class="btn btn-secondary py-1.5 px-3 text-xs" onclick="switchLang()" id="lang-btn">English</button>
            </div>
        </header>

        <div id="rules-box" class="hidden tool-panel mb-6 text-sm leading-relaxed text-slate-600">
            <strong id="rule-title" class="text-slate-800">遊戲玩法：</strong><br>
            <span id="rule-content">
                1. 出一個題目：大家都知道的名人。<br>
                2. 看完別人的題目後手機傳給下一位。<br>
                3. 每回合可以提問（是非題）或猜自己是誰。<br>
                4. 最快猜出獲勝！
            </span>
        </div>

        <div class="min-h-[300px] flex flex-col justify-center text-center">
            <div id="step-1">
                <div class="text-sm font-bold text-indigo-600 mb-4" id="status-1">遊戲設定</div>
                <label for="player-count" class="block text-slate-600 mb-3" id="label-player-count">請輸入總共幾個人要玩：</label>
                <input type="number" id="player-count" value="3" min="2" class="tool-input text-lg text-center">
                <button type="button" class="btn btn-primary btn-lg w-full mt-4" onclick="setupPlayers()" id="btn-start">開始設定</button>
            </div>

            <div id="step-2" class="hidden text-left">
                <div class="text-sm font-bold text-indigo-600 mb-4 text-center" id="input-status"></div>
                <div class="mb-4">
                    <label for="p-name" class="tool-label" id="label-name">你的名字：</label>
                    <input type="text" id="p-name" placeholder="輸入你的暱稱" class="tool-input text-base text-center">
                </div>
                <div class="mb-2">
                    <label for="p-target" class="tool-label" id="label-target">你要出的題目：</label>
                    <input type="text" id="p-target" placeholder="想一個人物名字" class="tool-input text-base text-center">
                </div>
                <button type="button" class="btn btn-primary btn-lg w-full mt-4" id="next-btn" onclick="savePlayerInfo()">下一位玩家</button>
            </div>

            <div id="step-3" class="hidden">
                <div class="text-5xl text-indigo-500 mb-5"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="text-sm font-bold text-indigo-600 mb-3" id="status-3">隱私確認</div>
                <p id="pass-message" class="text-slate-600 mb-6"></p>
                <button type="button" class="btn btn-primary btn-lg w-full" id="check-btn" onclick="showPlayerView()">查看資訊</button>
            </div>

            <div id="step-4" class="hidden">
                <div class="text-sm font-bold text-indigo-600 mb-3" id="view-player-name"></div>
                <p id="label-other-targets" class="text-slate-600">除了你以外，其他人的題目：</p>
                <div class="tool-panel my-5 text-left" id="others-list"></div>
                <button type="button" class="btn btn-primary btn-lg w-full" onclick="handleDoneViewing()" id="btn-done">我看完了</button>
            </div>

            <div id="step-5" class="hidden">
                <div class="text-5xl text-indigo-500 mb-5"><i class="fa-solid fa-champagne-glasses"></i></div>
                <div class="text-sm font-bold text-indigo-600 mb-3" id="status-5">遊戲進行中</div>
                <p id="label-recheck" class="text-slate-600">有人忘記了嗎？點名字重新查看：</p>
                <div id="recheck-grid" class="grid grid-cols-2 gap-2.5 mt-4"></div>
                <button type="button" class="btn btn-outline w-full mt-8" onclick="location.reload()" id="btn-restart">結束並重新開局</button>
            </div>
        </div>
    </main>

    <footer class="tool-footer">
        <span>© Shuojen.com</span>
        <span class="tool-footer-sep">·</span>
        <a href="/tool"><i class="fa-solid fa-arrow-left text-[10px]"></i> 回小工具</a>
    </footer>

<script>
    let totalPlayers = 0;
    let playersData = [];
    let currentInputIdx = 0;
    let currentViewIdx = 0;
    let currentLang = 'zh';
    let isRechecking = false; // 追蹤是否為遊戲中重新查看

    const langData = {
        zh: {
            title: "猜人名遊戲",
            rulesBtn: "遊戲規則",
            langBtn: "English",
            ruleTitle: "遊戲玩法：",
            ruleContent: "1. 出一個題目：大家都知道的名人。<br>2. 看完別人的題目後手機傳給下一位。<br>3. 每回合可以提問（是非題）或猜自己是誰。<br>4. 最快猜出獲勝！",
            status1: "遊戲設定",
            labelCount: "請輸入總共幾個人要玩：",
            btnStart: "開始設定",
            labelName: "你的名字：",
            labelTarget: "你要出的題目：",
            placeholderName: "輸入你的暱稱",
            placeholderTarget: "想一個人物名字",
            nextPlayer: "下一位玩家",
            startGame: "開始遊戲",
            status3: "隱私確認",
            checkBtn: "我是 {name}，查看資訊",
            labelOthers: "除了你以外，其他人的題目：",
            btnDone: "我看完了",
            status5: "遊戲進行中",
            labelRecheck: "有人忘記了嗎？點名字重新查看：",
            btnRestart: "結束並重新開局",
            passTo: "請將手機傳給<b class='block mt-2 text-2xl text-indigo-600'>{name}</b>",
            alertFill: "請填寫完整資訊！",
            alertMin: "至少要2個人喔！",
            viewOf: "{name} 的視角",
            isLabel: " 是："
        },
        en: {
            title: "Guess Who",
            rulesBtn: "Rules",
            langBtn: "中文",
            ruleTitle: "How to Play:",
            ruleContent: "1. Create a topic: A famous person everyone knows.<br>2. Check others' targets and pass the phone.<br>3. Each turn, ask a Yes/No question or guess who you are.<br>4. The first to guess correctly wins!",
            status1: "Settings",
            labelCount: "Enter total number of players:",
            btnStart: "Start Setup",
            labelName: "Your Name:",
            labelTarget: "Your Topic:",
            placeholderName: "Enter nickname",
            placeholderTarget: "Think of a person",
            nextPlayer: "Next Player",
            startGame: "Start Game",
            status3: "Privacy Check",
            checkBtn: "I am {name}, view info",
            labelOthers: "Other players' targets:",
            btnDone: "I'm done",
            status5: "Game in Progress",
            labelRecheck: "Forgot? Click to re-check:",
            btnRestart: "End & Restart",
            passTo: "Pass the phone to<b class='block mt-2 text-2xl text-indigo-600'>{name}</b>",
            alertFill: "Please fill in all info!",
            alertMin: "At least 2 players required!",
            viewOf: "{name}'s View",
            isLabel: " is: "
        }
    };

    function switchLang() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        document.documentElement.lang = currentLang === 'zh' ? 'zh-TW' : 'en';
        updateTexts();
    }

    function updateTexts() {
        const d = langData[currentLang];
        document.getElementById('title-text').innerText = d.title;
        document.getElementById('rules-btn').innerText = d.rulesBtn;
        document.getElementById('lang-btn').innerText = d.langBtn;
        document.getElementById('rule-title').innerText = d.ruleTitle;
        document.getElementById('rule-content').innerHTML = d.ruleContent;
        document.getElementById('status-1').innerText = d.status1;
        document.getElementById('label-player-count').innerText = d.labelCount;
        document.getElementById('btn-start').innerText = d.btnStart;
        document.getElementById('label-name').innerText = d.labelName;
        document.getElementById('label-target').innerText = d.labelTarget;
        document.getElementById('p-name').placeholder = d.placeholderName;
        document.getElementById('p-target').placeholder = d.placeholderTarget;
        document.getElementById('status-3').innerText = d.status3;
        document.getElementById('label-other-targets').innerText = d.labelOthers;
        document.getElementById('btn-done').innerText = d.btnDone;
        document.getElementById('status-5').innerText = d.status5;
        document.getElementById('label-recheck').innerText = d.labelRecheck;
        document.getElementById('btn-restart').innerText = d.btnRestart;

        // 畫面上動態產生的文字（輸入題目、傳手機、查看題目）也要換成新語言
        if (!document.getElementById('step-2').classList.contains('hidden')) updateInputUI();
        if (!document.getElementById('step-3').classList.contains('hidden')) showPassScreen();
        if (!document.getElementById('step-4').classList.contains('hidden')) showPlayerView();
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function toggleRules() {
        document.getElementById('rules-box').classList.toggle('hidden');
    }

    function setupPlayers() {
        totalPlayers = parseInt(document.getElementById('player-count').value, 10);
        // 留空或不是數字時 parseInt 會得到 NaN，NaN < 2 為 false，必須另外擋
        if (!Number.isInteger(totalPlayers) || totalPlayers < 2) return alert(langData[currentLang].alertMin);
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('rules-box').classList.add('hidden');
        updateInputUI();
    }

    function updateInputUI() {
        const d = langData[currentLang];
        document.getElementById('input-status').innerText = `${currentInputIdx + 1} / ${totalPlayers}`;
        document.getElementById('next-btn').innerText = (currentInputIdx === totalPlayers - 1) ? d.startGame : d.nextPlayer;
    }

    function savePlayerInfo() {
        const name = document.getElementById('p-name').value.trim();
        const target = document.getElementById('p-target').value.trim();
        if (!name || !target) return alert(langData[currentLang].alertFill);

        playersData.push({ name, submitted: target });
        currentInputIdx++;

        if (currentInputIdx < totalPlayers) {
            document.getElementById('p-name').value = '';
            document.getElementById('p-target').value = '';
            updateInputUI();
        } else {
            assignTargets();
            startViewingProcess();
        }
    }

    function assignTargets() {
        const allSubmitted = playersData.map(p => p.submitted);
        for (let i = 0; i < playersData.length; i++) {
            playersData[i].viewTarget = allSubmitted[(i + 1) % totalPlayers];
        }
    }

    function startViewingProcess() {
        document.getElementById('step-2').classList.add('hidden');
        isRechecking = false;
        showPassScreen();
    }

    function showPassScreen() {
        const p = playersData[currentViewIdx];
        const d = langData[currentLang];
        document.getElementById('step-4').classList.add('hidden');
        document.getElementById('step-5').classList.add('hidden');
        document.getElementById('step-3').classList.remove('hidden');
        document.getElementById('pass-message').innerHTML = d.passTo.replace('{name}', escapeHtml(p.name));
        document.getElementById('check-btn').innerText = d.checkBtn.replace('{name}', p.name);
    }

    function showPlayerView() {
        const p = playersData[currentViewIdx];
        const d = langData[currentLang];
        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('step-4').classList.remove('hidden');
        document.getElementById('view-player-name').innerText = d.viewOf.replace('{name}', p.name);

        const list = document.getElementById('others-list');
        list.innerHTML = '';
        playersData.forEach((player, idx) => {
            if (idx !== currentViewIdx) {
                const item = document.createElement('div');
                item.className = 'py-3 border-b border-slate-200 last:border-0 text-slate-700';
                item.innerHTML = `<b>${escapeHtml(player.name)}</b>${d.isLabel}<span class="font-bold text-indigo-600">${escapeHtml(player.viewTarget)}</span>`;
                list.appendChild(item);
            }
        });
    }

    function handleDoneViewing() {
        if (isRechecking) {
            showLobby();
        } else {
            currentViewIdx++;
            if (currentViewIdx < totalPlayers) {
                showPassScreen();
            } else {
                showLobby();
            }
        }
    }

    function showLobby() {
        document.getElementById('step-4').classList.add('hidden');
        document.getElementById('step-5').classList.remove('hidden');

        const grid = document.getElementById('recheck-grid');
        grid.innerHTML = '';
        playersData.forEach((p, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-secondary truncate';
            btn.innerText = p.name;
            btn.onclick = () => {
                currentViewIdx = index;
                isRechecking = true;
                showPassScreen();
            };
            grid.appendChild(btn);
        });
    }
</script>

</body>
</html>
