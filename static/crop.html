<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片裁切工具 - Shuojen.com</title>
    <meta name="description" content="線上快速圖片裁切小工具，可固定常用比例並輸出 PNG、JPG、WebP">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/tools/tool.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/tools/tool-theme.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <style>
        /* 裁切框改成主色（indigo） */
        .cropper-view-box {
            outline: 2px solid #4f46e5 !important;
            outline-color: #4f46e5 !important;
        }
        .cropper-line {
            background-color: #4f46e5 !important;
        }
        /* 控制點：白框 indigo 方塊，比預設大一點比較好拖 */
        .cropper-point {
            background-color: #4f46e5 !important;
            width: 10px !important;
            height: 10px !important;
            border-radius: 2px !important;
            border: 2px solid #ffffff !important;
        }
        .cropper-point.point-se, .cropper-point.point-sw, .cropper-point.point-ne, .cropper-point.point-nw {
            width: 14px !important;
            height: 14px !important;
        }
        .cropper-bg {
            background-image: repeating-linear-gradient(45deg, #f8fafc 25%, transparent 25%, transparent 75%, #f8fafc 75%, #f8fafc),
                              repeating-linear-gradient(45deg, #f8fafc 25%, #ffffff 25%, #ffffff 75%, #f8fafc 75%, #f8fafc) !important;
        }
    </style>
</head>
<body class="tool-page">

    <div class="tool-card max-w-5xl fade-in">

        <header class="tool-header">
            <div class="tool-header-main">
                <div class="tool-icon"><i class="fa-solid fa-crop"></i></div>
                <div>
                    <h1 class="tool-title">圖片裁切工具</h1>
                    <p class="tool-subtitle">拖拉四角與邊界，自由定義畫面範圍</p>
                </div>
            </div>
            <div class="tool-header-actions">
                <button id="btn-reset" type="button" class="btn btn-outline">
                    <i class="fa-solid fa-rotate-left"></i> 重設裁切框
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 items-start">

            <section class="md:col-span-1 flex flex-col gap-6">

                <div class="tool-panel">
                    <label for="image-input" class="tool-section-title"><i class="fa-solid fa-cloud-arrow-up text-indigo-500"></i> 1. 上傳來源圖片</label>
                    <div class="relative group border-2 border-dashed border-slate-300 hover:border-indigo-300 rounded-xl p-4 text-center cursor-pointer transition-all bg-white hover:bg-indigo-50/40">
                        <input type="file" id="image-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="space-y-2">
                            <i class="fa-solid fa-image text-3xl text-slate-300 group-hover:text-indigo-400 transition-all"></i>
                            <p class="text-xs text-slate-500">點擊或拖曳圖片至此處</p>
                        </div>
                    </div>
                </div>

                <div id="control-card" class="tool-panel hidden space-y-5">

                    <div>
                        <div class="tool-section-title"><i class="fa-solid fa-vector-square text-orange-500"></i> 2. 常用比例固定</div>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" class="ratio-btn text-xs py-2 px-3 bg-indigo-50 text-indigo-600 border border-indigo-100 font-medium rounded-lg transition-all" data-ratio="NaN">自由裁切</button>
                            <button type="button" class="ratio-btn text-xs py-2 px-3 bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 rounded-lg transition-all" data-ratio="1">1 : 1 (正方形)</button>
                            <button type="button" class="ratio-btn text-xs py-2 px-3 bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 rounded-lg transition-all" data-ratio="1.77777777778">16 : 9 (寬螢幕)</button>
                            <button type="button" class="ratio-btn text-xs py-2 px-3 bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 rounded-lg transition-all" data-ratio="1.33333333333">4 : 3 (傳統)</button>
                        </div>
                    </div>

                    <div>
                        <div class="tool-section-title"><i class="fa-solid fa-chart-simple text-emerald-500"></i> 3. 當前裁切尺寸</div>
                        <div id="info-box" class="bg-white rounded-xl p-4 text-xs text-slate-600 space-y-2 border border-slate-200">
                            <div class="flex justify-between"><span>原始圖片尺寸：</span> <span id="info-ori" class="font-bold text-slate-700">-</span></div>
                            <div class="flex justify-between"><span>目標裁切尺寸：</span> <span id="info-new" class="font-bold text-emerald-600">-</span></div>
                        </div>
                    </div>

                    <div>
                        <label for="format-select" class="tool-section-title"><i class="fa-solid fa-file-export text-blue-500"></i> 4. 輸出檔案格式</label>
                        <select id="format-select" class="tool-input cursor-pointer">
                            <option value="image/png">PNG 格式 (.png)</option>
                            <option value="image/jpeg">JPG 格式 (.jpg)</option>
                            <option value="image/webp">WebP 格式 (.webp)</option>
                        </select>
                    </div>

                    <button id="btn-download" type="button" class="btn btn-primary w-full py-3">
                        <i class="fa-solid fa-download"></i> 下載裁切後的圖片
                    </button>
                </div>
            </section>

            <section class="md:col-span-2 flex flex-col h-full min-h-[350px]">
                <div class="border border-slate-100 bg-slate-50 rounded-2xl p-4 flex flex-col justify-center items-center flex-grow relative overflow-hidden min-h-[400px]">

                    <div id="preview-placeholder" class="text-center space-y-3">
                        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto">
                            <i class="fa-regular fa-images text-2xl"></i>
                        </div>
                        <p class="text-sm text-slate-400">尚未載入圖片，請從左側上傳</p>
                    </div>

                    <div id="preview-container" class="hidden w-full h-full flex flex-col items-center justify-center">
                        <p class="text-xs text-slate-400 mb-3 flex items-center gap-1">
                            <i class="fa-solid fa-up-down-left-right text-indigo-500"></i> 提示：可直接拖曳四周邊框與方形錨點改變範圍，亦可按住框內任意平移。
                        </p>
                        <div class="max-w-full max-h-[450px] border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm">
                            <img id="preview-img" src="" alt="裁切預覽" class="max-w-full block">
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <footer class="tool-footer">
        <span>© Shuojen.com</span>
        <span class="tool-footer-sep">·</span>
        <a href="/tool"><i class="fa-solid fa-arrow-left text-[10px]"></i> 回小工具</a>
    </footer>

    <script>
        const imageInput = document.getElementById('image-input');
        const btnDownload = document.getElementById('btn-download');
        const btnReset = document.getElementById('btn-reset');
        
        const controlCard = document.getElementById('control-card');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');

        const infoOri = document.getElementById('info-ori');
        const infoNew = document.getElementById('info-new');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        const formatSelect = document.getElementById('format-select');

        let cropper = null;
        let originalWidth = 0;
        let originalHeight = 0;

        function setActiveRatioBtn(activeBtn) {
            ratioBtns.forEach(b => {
                b.classList.remove('bg-indigo-50', 'text-indigo-600', 'border-indigo-100');
                b.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            });
            activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
            activeBtn.classList.add('bg-indigo-50', 'text-indigo-600', 'border-indigo-100');
        }

        // 監聽圖片上傳
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            e.target.value = ''; // 讓同一個檔案可以再選一次
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                if (cropper) {
                    cropper.destroy();
                }

                // 新圖片一律從自由裁切開始，按鈕狀態也要跟著重設
                setActiveRatioBtn(ratioBtns[0]);
                previewImg.src = event.target.result;

                controlCard.classList.remove('hidden');
                previewContainer.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');

                // 初始化 Cropper.js 全功能自由裁切
                cropper = new Cropper(previewImg, {
                    viewMode: 1,         // 限制裁剪框不能超出圖片範圍
                    autoCropArea: 0.9,   // 初始選取區佔 90%
                    responsive: true,
                    restore: false,
                    modal: true,         // 顯示陰影背景
                    guides: true,        // 顯示虛線輔助線
                    highlight: true,
                    crop(event) {
                        const width = Math.round(event.detail.width);
                        const height = Math.round(event.detail.height);
                        infoNew.textContent = `${width} × ${height} px`;
                    },
                    ready() {
                        const imageData = cropper.getImageData();
                        originalWidth = imageData.naturalWidth;
                        originalHeight = imageData.naturalHeight;
                        infoOri.textContent = `${originalWidth} × ${originalHeight} px`;
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // 比例切換按鈕邏輯
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!cropper) return;

                setActiveRatioBtn(btn);

                const targetRatio = parseFloat(btn.getAttribute('data-ratio'));
                cropper.setAspectRatio(targetRatio);
            });
        });

        // 執行下載 (根據使用者選擇的格式進行匯出)
        btnDownload.addEventListener('click', () => {
            if (!cropper) return;

            const selectedFormat = formatSelect.value;
            let ext = 'png';
            if (selectedFormat === 'image/jpeg') ext = 'jpg';
            if (selectedFormat === 'image/webp') ext = 'webp';

            const croppedCanvas = cropper.getCroppedCanvas({
                // JPG 沒有透明通道，透明處預設會變成黑色，改用白色填滿
                fillColor: selectedFormat === 'image/jpeg' ? '#ffffff' : 'transparent',
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            // 用 toBlob 而不是 toDataURL：大圖轉成 data URL 可能超過瀏覽器上限而下載失敗
            croppedCanvas.toBlob(blob => {
                if (!blob) {
                    alert('輸出失敗，請改用其他格式或縮小裁切範圍再試一次。');
                    return;
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `cropped_${Date.now()}.${ext}`;
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            }, selectedFormat, selectedFormat === 'image/png' ? undefined : 0.92); // jpg / webp 給予 0.92 的優質壓縮率
        });

        // 重設按鈕
        btnReset.addEventListener('click', () => {
            if (cropper) {
                cropper.reset();
            }
        });
    </script>
</body>
</html>
