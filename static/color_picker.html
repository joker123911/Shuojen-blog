<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁取色器 - Shuojen.com</title>
    <meta name="description" content="快速吸取並複製螢幕上的十六進位色碼">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/tools/tool.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/tools/tool-theme.js"></script>
</head>
<body class="tool-page justify-center">

    <main class="tool-card max-w-md fade-in">
        <header class="tool-header">
            <div class="tool-header-main">
                <div class="tool-icon"><i class="fa-solid fa-eye-dropper"></i></div>
                <div>
                    <h1 class="tool-title">網頁取色器</h1>
                    <p class="tool-subtitle">吸取螢幕上任一點的顏色，色碼會自動複製</p>
                </div>
            </div>
        </header>

        <div class="text-center">
            <div id="colorPreview" class="w-32 h-32 mx-auto mb-6 rounded-full border-[6px] border-white shadow-lg ring-1 ring-slate-100 transition-colors duration-300" style="background-color: #dddddd;"></div>

            <div class="flex flex-wrap justify-center gap-3 mb-6">
                <div id="hexValue" class="px-4 py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-mono font-bold text-base hover:bg-indigo-100 transition-colors">#DDDDDD</div>
                <div id="rgbValue" class="px-4 py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-mono font-bold text-base hover:bg-indigo-100 transition-colors">rgb(221, 221, 221)</div>
            </div>

            <button id="pickBtn" type="button" class="btn btn-primary btn-lg w-full">
                <i class="fa-solid fa-eye-dropper"></i> 開始取色
            </button>

            <p id="copyStatus" class="min-h-[1.5em] mt-4 text-sm font-bold" aria-live="polite"></p>
            <p id="errorMsg" class="hidden mt-2 p-4 rounded-xl bg-red-50 text-red-700 text-sm font-medium">
                抱歉，這個瀏覽器不支援取色功能（EyeDropper API），請改用電腦版 Chrome 或 Edge。
            </p>
        </div>
    </main>

    <footer class="tool-footer">
        <span>© Shuojen.com</span>
        <span class="tool-footer-sep">·</span>
        <a href="/tool"><i class="fa-solid fa-arrow-left text-[10px]"></i> 回小工具</a>
    </footer>

<script>
    const pickBtn = document.getElementById('pickBtn');
    const colorPreview = document.getElementById('colorPreview');
    const hexValue = document.getElementById('hexValue');
    const rgbValue = document.getElementById('rgbValue');
    const errorMsg = document.getElementById('errorMsg');

    // 檢查瀏覽器是否支援 EyeDropper API
    if (!window.EyeDropper) {
        errorMsg.classList.remove('hidden');
        pickBtn.disabled = true;
    } else {
        const eyeDropper = new EyeDropper();

        pickBtn.addEventListener('click', () => {
            eyeDropper.open().then(result => {
                const colorHex = result.sRGBHex.toUpperCase();

                // 更新顏色預覽與數值
                colorPreview.style.backgroundColor = colorHex;
                hexValue.innerText = colorHex;

                // 轉換 HEX 為 RGB 顯示
                const r = parseInt(colorHex.slice(1, 3), 16);
                const g = parseInt(colorHex.slice(3, 5), 16);
                const b = parseInt(colorHex.slice(5, 7), 16);
                rgbValue.innerText = `rgb(${r}, ${g}, ${b})`;

                // 自動複製到剪貼簿，並告訴使用者有沒有成功
                copyColor(colorHex);
            }).catch(() => {
                // 使用者按 Esc 取消取色，不需要提示
            });
        });
    }

    const copyStatus = document.getElementById('copyStatus');
    let copyStatusTimer = null;

    function copyColor(text) {
        const show = (message, ok) => {
            copyStatus.textContent = message;
            copyStatus.style.color = ok ? '#059669' : '#b91c1c';
            if (copyStatusTimer) clearTimeout(copyStatusTimer);
            copyStatusTimer = setTimeout(() => { copyStatus.textContent = ''; }, 2500);
        };
        if (!navigator.clipboard) {
            show('無法自動複製，請手動選取色碼', false);
            return;
        }
        navigator.clipboard.writeText(text)
            .then(() => show(`已複製 ${text}`, true))
            .catch(() => show('無法自動複製，請手動選取色碼', false));
    }

    // 點擊色碼也可以再複製一次
    [hexValue, rgbValue].forEach(el => {
        el.style.cursor = 'pointer';
        el.title = '點擊複製';
        el.addEventListener('click', () => copyColor(el.innerText));
    });
</script>

</body>
</html>
