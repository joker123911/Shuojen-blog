<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔術方塊白底十字最短路徑求解器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p.description {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background-color: #151515;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            box-sizing: border-box;
            resize: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #333;
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            background-color: #151515;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .result-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            align-self: flex-start;
        }

        .solution {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            word-spacing: 6px;
            letter-spacing: 0.5px;
        }

        .info-notes {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>魔術方塊白底十字求解器</h2>
    <p class="description">輸入打亂代號（Scramble），快速計算出最少步數的底面白色十字解法。</p>
    
    <div class="input-group">
        <label for="scrambleInput">請輸入打亂代號 (例如圖片中的範例)：</label>
        <textarea id="scrambleInput" placeholder="例如: R2 B2 D2 B' L' U' D L2 D' R' D L2 B2 D2 L2 F L2 F R2 U2"></textarea>
    </div>

    <div class="btn-container">
        <button class="secondary" onclick="loadExample()">載入圖片範例</button>
        <button id="solveBtn" onclick="startSolve()">計算最少步數解</button>
    </div>

    <div class="result-box">
        <div class="result-title">白底十字最短路徑解法：</div>
        <div id="solutionOutput" class="solution">等待輸入...</div>
    </div>

    <div class="info-notes">
        <strong>使用說明與設定：</strong><br>
        1. 預設打亂基準（WCA標準）：白頂 (U)、綠前 (F)。<br>
        2. 計算目標：將 4 個白邊（白綠、白紅、白藍、白橘）歸位到<strong>底部 (D面)</strong>，並與四周中心塊顏色對齊。<br>
        3. 本工具採用 BFS 演算法，保證輸出絕對是最短路徑（通常在 0 到 8 步之內）。
    </div>
</div>

<script>
    // 定義 24 個邊塊面緣 (Facelets) 的索引位置
    // 標準 WCA 狀態：U=白, D=黃, F=綠, B=藍, L=橘, R=紅
    // 我們只追蹤 4 個白邊塊的原始面緣位置：
    // UB(0=白, 1=藍), UL(2=白, 3=橘), UR(4=白, 5=紅), UF(6=白, 7=綠)
    const moves = {
        'U': [0, 2, 6, 4,   1, 3, 7, 5],
        'D': [22, 20, 16, 18, 23, 21, 17, 19],
        'R': [5, 11, 21, 15, 4, 10, 20, 14],
        'L': [3, 13, 19, 9,  2, 12, 18, 8],
        'F': [7, 14, 23, 12, 6, 15, 22, 13],
        'B': [1, 8, 17, 10, 0, 9, 16, 11]
    };

    const allMoves = [
        "U", "U'", "U2", "D", "D'", "D2", 
        "R", "R'", "R2", "L", "L'", "L2", 
        "F", "F'", "F2", "B", "B'", "B2"
    ];

    // 載入圖片中的打亂範例
    function loadExample() {
        document.getElementById('scrambleInput').value = "R2 B2 D2 B' L' U' D L2 D' R' D L2 B2 D2 L2 F L2 F R2 U2";
    }

    // 執行一次基礎旋轉
    function applyCycle(arr, cycle) {
        let temp = arr[cycle[3]];
        arr[cycle[3]] = arr[cycle[2]];
        arr[cycle[2]] = arr[cycle[1]];
        arr[cycle[1]] = arr[cycle[0]];
        arr[cycle[0]] = temp;
    }

    function doMove(state, moveStr) {
        let newState = [...state];
        let base = moveStr[0];
        let modifier = moveStr.slice(1);
        let cycles = moves[base];
        if (!cycles) return newState;

        let count = 1;
        if (modifier === "'") count = 3;
        if (modifier === '2') count = 2;

        for (let i = 0; i < count; i++) {
            applyCycle(newState, cycles.slice(0, 4));
            applyCycle(newState, cycles.slice(4, 8));
        }
        return newState;
    }

    // 檢查白底十字是否完成 (對齊 D 面的四個相應中心塊位置)
    // 原始 UB邊(白=0) 應到 DB位置(16)
    // 原始 UL邊(白=2) 應到 DL位置(18)
    // 原始 UR邊(白=4) 應到 DR位置(20)
    // 原始 UF邊(白=6) 應到 DF位置(22)
    function isCrossSolved(state) {
        return state[16] === 0 && state[18] === 2 && state[20] === 4 && state[22] === 6;
    }

    // 產生狀態特徵 Key，用來過濾重複狀態
    function getStateKey(state) {
        return `${state.indexOf(0)}-${state.indexOf(2)}-${state.indexOf(4)}-${state.indexOf(6)}`;
    }

    function startSolve() {
        const scrambleText = document.getElementById('scrambleInput').value;
        const solveBtn = document.getElementById('solveBtn');
        const output = document.getElementById('solutionOutput');

        if (!scrambleText.trim()) {
            output.innerText = "請先輸入打亂代號";
            return;
        }

        solveBtn.disabled = true;
        output.innerText = "計算中...";

        // 異步執行避免網頁畫面卡死
        setTimeout(() => {
            // 初始化方塊狀態 (0 到 23 代表 24 個邊塊面緣)
            let state = Array.from({length: 24}, (_, i) => i);

            // 解析並套用打亂代號
            let scrambleMoves = scrambleText.trim().split(/\s+/);
            for (let move of scrambleMoves) {
                if (move) {
                    state = doMove(state, move);
                }
            }

            // 如果已經好了
            if (isCrossSolved(state)) {
                output.innerText = "已是完成狀態 (0 步)";
                solveBtn.disabled = false;
                return;
            }

            // 開始 BFS 搜尋最短路徑
            let queue = [{ state: state, path: [] }];
            let visited = new Set();
            visited.add(getStateKey(state));
            let foundSolution = null;

            while (queue.length > 0) {
                let current = queue.shift();

                if (isCrossSolved(current.state)) {
                    foundSolution = current.path;
                    break;
                }

                // 限制最大搜尋深度為 8 步 (十字通常不大於 8 步)
                if (current.path.length >= 8) continue;

                let lastMove = current.path[current.path.length - 1];

                for (let move of allMoves) {
                    // 剪枝優化：不連續轉動同一個面 (例如不連續做 U 後又做 U')
                    if (lastMove && lastMove[0] === move[0]) continue;

                    let nextState = doMove(current.state, move);
                    let key = getStateKey(nextState);

                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            state: nextState,
                            path: [...current.path, move]
                        });
                    }
                }
            }

            if (foundSolution) {
                output.innerText = foundSolution.join(' ');
            } else {
                output.innerText = "未找到 8 步內的解法，請檢查打亂代號";
            }
            solveBtn.disabled = false;
        }, 50);
    }
</script>

</body>
</html>
